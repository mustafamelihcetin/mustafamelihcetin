<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="A tiny animated solar system">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E24"/>
      <stop offset="1" stop-color="#1A1F55"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset="0.45" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p1" cx="35%" cy="35%" r="65%"><stop offset="0" stop-color="#C9D1FF"/><stop offset="1" stop-color="#6C78F0"/></radialGradient>
    <radialGradient id="p2" cx="35%" cy="35%" r="65%"><stop offset="0" stop-color="#9FF2D6"/><stop offset="1" stop-color="#17A37A"/></radialGradient>
    <radialGradient id="p3" cx="35%" cy="35%" r="65%"><stop offset="0" stop-color="#FFC2D9"/><stop offset="1" stop-color="#D94F8A"/></radialGradient>
    <radialGradient id="p4" cx="35%" cy="35%" r="65%"><stop offset="0" stop-color="#FFE3B0"/><stop offset="1" stop-color="#D18A2E"/></radialGradient>
    <clipPath id="frame"><rect width="900" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="280" fill="url(#sky)"/>

    <!-- Twinkling stars -->
    <g fill="#FFFFFF">
      <circle cx="40" cy="30" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="210" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="60" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="250" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="25" r="1.1"><animate attributeName="opacity" values=".9;.2;.9" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="35" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="245" r="1"><animate attributeName="opacity" values="1;.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="70" r="1.2"><animate attributeName="opacity" values=".4;1;.4" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="220" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="40" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="80" cy="140" r=".9" opacity=".6"/>
      <circle cx="250" cy="150" r=".8" opacity=".5"/>
      <circle cx="640" cy="150" r=".9" opacity=".6"/>
      <circle cx="830" cy="150" r=".8" opacity=".5"/>
      <circle cx="160" cy="95" r=".8" opacity=".5"/>
      <circle cx="740" cy="120" r=".8" opacity=".5"/>
    </g>

    <!-- A shooting star now and then -->
    <line x1="0" y1="0" x2="60" y2="18" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;.9;0" keyTimes="0;.85;.9;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="80,40;80,40;300,105" keyTimes="0;.85;1" dur="9s" repeatCount="indefinite"/>
    </line>

    <!-- Orbits (tilted ellipses around the sun at 450,140) -->
    <g fill="none" stroke="#8B95F5" stroke-opacity=".22" stroke-width="1">
      <ellipse cx="450" cy="140" rx="90" ry="26"/>
      <ellipse cx="450" cy="140" rx="160" ry="46"/>
      <ellipse cx="450" cy="140" rx="250" ry="72"/>
      <ellipse cx="450" cy="140" rx="360" ry="104"/>
    </g>

    <!-- Sun -->
    <circle cx="450" cy="140" r="64" fill="url(#glow)">
      <animate attributeName="r" values="60;68;60" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="140" r="26" fill="url(#sun)"/>

    <!-- Planets -->
    <circle r="6" fill="url(#p1)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M360,140 a90,26 0 1,0 180,0 a90,26 0 1,0 -180,0"/>
    </circle>
    <g>
      <animateMotion dur="9s" repeatCount="indefinite" path="M290,140 a160,46 0 1,0 320,0 a160,46 0 1,0 -320,0"/>
      <circle r="9" fill="url(#p2)"/>
      <circle r="2.2" fill="#E8ECFF">
        <animateMotion dur="1.6s" repeatCount="indefinite" path="M-16,0 a16,6 0 1,0 32,0 a16,6 0 1,0 -32,0"/>
      </circle>
    </g>
    <g>
      <animateMotion dur="15s" repeatCount="indefinite" path="M200,140 a250,72 0 1,0 500,0 a250,72 0 1,0 -500,0"/>
      <ellipse rx="20" ry="5" fill="none" stroke="#FFD9A0" stroke-opacity=".8" stroke-width="2"/>
      <circle r="11" fill="url(#p4)"/>
    </g>
    <circle r="7" fill="url(#p3)">
      <animateMotion dur="24s" repeatCount="indefinite" path="M90,140 a360,104 0 1,0 720,0 a360,104 0 1,0 -720,0"/>
    </circle>

    <text x="880" y="266" text-anchor="end" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#B9C0FF" fill-opacity=".85">play with the real one at malthen.dev →</text>
  </g>
</svg>
