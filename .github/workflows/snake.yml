# Draws the contribution-graph snake into the "output" branch every day.
name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#4E58CC&color_dots=#ebedf0,#c7cbf5,#9aa2ee,#6C78F0,#4E58CC
            dist/snake-dark.svg?palette=github-dark&color_snake=#8B95F5&color_dots=#161b22,#262b5a,#3a4190,#5560c8,#8B95F5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
